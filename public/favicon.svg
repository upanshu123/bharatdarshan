<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Box -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle India Saffron / White / Green accent ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.2"/>
  
  <!-- MapPin Icon -->
  <g filter="url(#shadow)" transform="translate(256, 240)">
    <path d="M 0 -130 C -70 -130 -125 -75 -125 -5 C -125 75 0 160 0 160 C 0 160 125 75 125 -5 C 125 -75 70 -130 0 -130 Z" fill="#ffffff"/>
    <circle cx="0" cy="-10" r="45" fill="#ea580c"/>
    <!-- Sun rays inside pin -->
    <circle cx="0" cy="-10" r="22" fill="#ffffff"/>
  </g>
</svg>
